name: Windows verification

on:
  push:
    branches: [smallcloset-app]
    paths-ignore: ['README.md', 'VALIDATION.md', 'WINDOWS-START-HERE.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SM_HEADLESS: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install using the actual Windows batch file
        env:
          SM_DATA_DIR: ${{ runner.temp }}\SmallCloset Windows test
        shell: powershell
        run: |
          cmd.exe /d /c "INSTALL-WINDOWS.bat <NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native OCR, browser, UI and desktop checks
        env:
          SM_DATA_DIR: ${{ runner.temp }}\SmallCloset Windows test
          SM_TEST_LOG: ${{ runner.temp }}\smallcloset-windows-checks.txt
        shell: powershell
        run: |
          cmd.exe /d /c 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows.ps1 -Mode Test > "%SM_TEST_LOG%" 2>&1'
          $checkExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $env:SM_TEST_LOG -Encoding UTF8
          @('### Windows verification output', '```text') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Get-Content -LiteralPath $env:SM_TEST_LOG -Encoding UTF8 -Tail 150 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          exit $checkExitCode
      - name: Report Windows verification details
        if: always()
        env:
          SM_TEST_LOG: ${{ runner.temp }}\smallcloset-windows-checks.txt
          SM_VERIFY_STATUS: ${{ job.status }}
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:SM_TEST_LOG) {
            $details = (Get-Content -LiteralPath $env:SM_TEST_LOG -Encoding UTF8 -Tail 100) -join "`n"
            $escaped = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($env:SM_VERIFY_STATUS -eq 'success') {
              Write-Output "::notice title=Windows verification passed::$escaped"
            } else {
              Write-Output "::error title=Windows verification diagnostics::$escaped"
            }
          }
