name: Windows verification

on:
  push:
    branches: [smallcloset-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SM_HEADLESS: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install using the actual Windows batch file
        env:
          SM_DATA_DIR: ${{ runner.temp }}\SmallCloset Windows test
        shell: powershell
        run: |
          cmd.exe /d /c "INSTALL-WINDOWS.bat <NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native OCR, browser, UI and desktop checks
        env:
          SM_DATA_DIR: ${{ runner.temp }}\SmallCloset Windows test
        shell: powershell
        run: |
          & .\scripts\windows.ps1 -Mode Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
